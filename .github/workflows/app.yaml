name: Home Kiosk app

on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated app image to GHCR
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Read release identity before image build
        id: release
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('config.json', 'utf8'));
          console.log(`version=${config.version}`);
          console.log(`image=${config.image}`);
          JS
      - run: npm run build:app
      - name: Check shell syntax
        run: |
          bash -n rootfs/etc/cont-init.d/kiosk-preflight.sh
          bash -n rootfs/etc/services.d/app/run
          bash -n rootfs/etc/services.d/kiosk/run
          bash -n rootfs/etc/services.d/kiosk/finish
          bash -n rootfs/usr/bin/kiosk-session
      - uses: frenck/action-addon-linter@v2.21
        with:
          path: '.'
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
          tags: |
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
          build-args: BUILD_VERSION=${{ steps.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
